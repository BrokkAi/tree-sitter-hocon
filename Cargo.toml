[package]
name = "brokk-tree-sitter-hocon"
description = "Brokk-maintained HOCON grammar for the tree-sitter parsing library"
version = "0.1.0"
authors = ["Anton Kudryavtsev", "Brokk"]
license = "MIT"
readme = "bindings/rust/README.md"
keywords = ["incremental", "parsing", "tree-sitter", "hocon"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/BrokkAi/tree-sitter-hocon"
homepage = "https://github.com/BrokkAi/tree-sitter-hocon"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = ["/LICENSE", "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1"

[dev-dependencies]
tree-sitter = "0.25"
